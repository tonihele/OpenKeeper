import java.text.SimpleDateFormat

plugins {
    id 'java'
    id 'application'
    id 'eclipse'
    id 'maven-publish'
    id 'idea'
}

ext {
    jmonkeyengine_version = '3.9.0-stable'
    license = file("$rootDir/license.txt")
}

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url = "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url = "https://jitpack.io" }
    }
}

application {
    applicationName = 'OpenKeeper'
    mainClass = 'toniarts.openkeeper.Main'
    if (System.getProperty("os.name").toLowerCase().contains("mac")) {
        applicationDefaultJvmArgs = ["-Dvisualvm.display.name=OpenKeeper", "-XstartOnFirstThread"]
    }
    else {
        applicationDefaultJvmArgs = ["-Dvisualvm.display.name=OpenKeeper"]
    }
}

tasks.register("modelViewer", JavaExec) {
    group = ApplicationPlugin.APPLICATION_GROUP
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'toniarts.openkeeper.tools.modelviewer.ModelViewer'
}

tasks.register("auditAnimationAssets", JavaExec) {
    group = "verification"
    description = "Read-only pose validation against installed DK2 data and existing converted assets"
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'toniarts.openkeeper.animation.AnimationAssetAudit'
    workingDir providers.gradleProperty('animationWorkingDir').orElse(projectDir.absolutePath).get()
    args providers.gradleProperty('dk2Root').orElse('').get(),
            providers.gradleProperty('convertedAssets').orElse('assets/Converted').get()
    if (providers.gradleProperty('animationAuditAllCreatures').orElse('false').get().toBoolean()) args '--all-creatures'
    if (providers.gradleProperty('animationAuditReportOnly').orElse('false').get().toBoolean()) args '--report-only'
    if (providers.gradleProperty('animationAuditPacked').orElse('false').get().toBoolean()) args '--packed'
}

tasks.register("benchmarkCharacterAnimation", JavaExec) {
    group = "verification"
    description = "Opt-in installed-asset CPU pose/crowd/transition benchmark (not GPU frame time)"
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'toniarts.openkeeper.animation.AnimationCrowdBenchmark'
    workingDir providers.gradleProperty('animationWorkingDir').orElse(projectDir.absolutePath).get()
    args providers.gradleProperty('convertedAssets').orElse('assets/Converted').get()
    if (providers.gradleProperty('animationRuns').isPresent() || providers.gradleProperty('animationModels').isPresent()) {
        args providers.gradleProperty('animationRuns').orElse('1').get()
        if (providers.gradleProperty('animationModels').isPresent()) args providers.gradleProperty('animationModels').get()
    }
    maxHeapSize = '1g'
    if (providers.gradleProperty('animationJfr').isPresent()) {
        jvmArgs "-XX:StartFlightRecording=filename=${providers.gradleProperty('animationJfr').get()},settings=profile,dumponexit=true"
    }
}

tasks.register("auditCreatureAnimationCatalog", JavaExec) {
    group = "verification"
